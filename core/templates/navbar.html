<script>
(function() {
  var match = document.cookie.match(/(?:^|;\s*)last_library=([^;]+)/);
  if (match) {
    var url = '/libraries/' + match[1] + '/add-book/';
    var d = document.getElementById('add-book-link-desktop');
    var m = document.getElementById('add-book-link-mobile');
    if (d) d.href = url;
    if (m) m.href = url;
  }
})();
</script>
