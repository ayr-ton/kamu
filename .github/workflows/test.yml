name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kamu
          POSTGRES_PASSWORD: kamu
          POSTGRES_DB: kamu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kamu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://kamu:kamu@localhost:5432/kamu
      DJANGO_SETTINGS_MODULE: core.settings.test
      KAMU_ENABLE_ASYNC_TASKS: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv
          uv pip sync requirements.lock

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          coverage run manage.py test
          coverage report --fail-under=70
          coverage xml

      - name: Lint
        run: |
          source .venv/bin/activate
          flake8 --max-line-length=120 --exclude=node_modules,migrations,.venv,public,*/test/* books/ waitlist/ core/
